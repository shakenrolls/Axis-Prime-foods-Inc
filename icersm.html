<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;}

  .slide{
    position:absolute;
    top:0;left:0;width:100%;height:100%;
    opacity:0;
    transition:opacity 1.2s ease-in-out;
    pointer-events:none;
  }
  .slide.active{
    opacity:1;
    pointer-events:auto;
  }
  .slide iframe{
    width:1920px;height:1080px;
    border:none;
    transform-origin:top left;
    display:block;
    background:#fff;
  }

  /* DOTS */
  .dots{
    position:fixed;
    bottom:22px;left:50%;
    transform:translateX(-50%);
    display:flex;gap:16px;
    z-index:9999;
  }
  .dot{
    width:16px;height:16px;
    border-radius:50%;
    background:rgba(255,255,255,0.3);
    border:2px solid rgba(255,255,255,0.5);
    transition:background 0.4s,transform 0.4s;
    cursor:pointer;
  }
  .dot.on{
    background:#FFD600;
    border-color:#FFD600;
    transform:scale(1.5);
    box-shadow:0 0 10px #FFD600;
  }

  /* PROGRESS BAR */
  .progress{
    position:fixed;
    bottom:0;left:0;height:5px;
    background:linear-gradient(90deg,#ff2d78,#FFD600,#4DB8FF);
    width:0%;
    z-index:9998;
  }

  /* SLIDE LABEL */
  .slide-label{
    position:fixed;
    top:16px;right:24px;
    font-family:Arial,sans-serif;
    font-size:13px;font-weight:700;
    color:rgba(255,255,255,0.4);
    z-index:9999;
    letter-spacing:1px;
    text-transform:uppercase;
  }
</style>

function b64decode(str){
  var bin = atob(str);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function scaleIframe(iframe){
  var sx = window.innerWidth  / 1920;
  var sy = window.innerHeight / 1080;
  var s  = Math.min(sx, sy);
  iframe.style.transform = 'scale('+s+')';
  iframe.parentElement.style.width  = window.innerWidth+'px';
  iframe.parentElement.style.height = window.innerHeight+'px';
}

function scaleAll(){
  document.querySelectorAll('.slide iframe').forEach(scaleIframe);
}
window.addEventListener('resize', scaleAll);

function startProgress(dur){
  var bar = document.getElementById('progress');
  clearInterval(progTimer);
  progStart = Date.now();
  progDur   = dur * 1000;
  bar.style.width = '0%';
  progTimer = setInterval(function(){
    var pct = Math.min((Date.now()-progStart)/progDur*100, 100);
    bar.style.width = pct+'%';
    if(pct>=100) clearInterval(progTimer);
  }, 40);
}

function goTo(idx){
  clearTimeout(slideTimer);
  clearInterval(progTimer);
  document.getElementById('slide'+current).classList.remove('active');
  document.getElementById('dot'+current).classList.remove('on');
  current = ((idx % total) + total) % total;
  document.getElementById('slide'+current).classList.add('active');
  document.getElementById('dot'+current).classList.add('on');
  document.getElementById('slide-label').textContent = LABELS[current];
  startProgress(DURATIONS[current]);
  slideTimer = setTimeout(function(){ goTo(current+1); }, DURATIONS[current]*1000);
}

window.addEventListener('DOMContentLoaded', function(){
  // Decode and inject both slides
  var ice = b64decode(ICE_B64);
  var rsm = b64decode(RSM_B64);
  var f0  = document.getElementById('iframe0');
  var f1  = document.getElementById('iframe1');
  f0.srcdoc = ice;
  f1.srcdoc = rsm;
  f0.addEventListener('load', scaleAll);
  f1.addEventListener('load', scaleAll);
  scaleAll();
  // Start slideshow
  startProgress(DURATIONS[0]);
  slideTimer = setTimeout(function(){ goTo(1); }, DURATIONS[0]*1000);
});
</script>
