<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shake N Rolls – Screen 1</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:1920px; height:1080px;
    overflow:hidden;
    background:#0a0510;
  }

  /* ── SLIDES ── */
  .slide {
    position:absolute; top:0; left:0;
    width:1920px; height:1080px;
    opacity:0;
    transition:opacity 1s ease-in-out;
    pointer-events:none;
  }

  .slide.active {
    opacity:1;
    pointer-events:auto;
  }

  .slide iframe {
    width:1920px; height:1080px;
    border:none; display:block;
  }

  /* ── SLIDE INDICATOR DOTS ── */
  .dots {
    position:fixed; bottom:20px; left:50%;
    transform:translateX(-50%);
    display:flex; align-items:center; gap:14px;
    z-index:9999;
  }

  .dot {
    width:12px; height:12px; border-radius:50%;
    background:rgba(255,255,255,.22);
    border:1.5px solid rgba(255,255,255,.35);
    transition:all 0.4s ease;
    flex-shrink:0;
  }

  .dot.active {
    background:#ff2d78;
    border-color:#ff6fa8;
    box-shadow:0 0 12px rgba(255,45,120,.7);
    transform:scale(1.3);
  }

  .dot-label {
    font-family:sans-serif; font-size:11px; font-weight:700;
    color:rgba(255,255,255,.35); letter-spacing:2px;
    text-transform:uppercase; user-select:none;
  }

  /* ── COUNTDOWN BAR — thin pink strip at very bottom ── */
  .progress {
    position:fixed; bottom:0; left:0;
    height:3px; width:100%;
    background:rgba(255,255,255,.07);
    z-index:9998;
  }

  .progress-bar {
    height:100%;
    background:linear-gradient(90deg,#ff2d78,#ffcc00,#ff2d78);
    background-size:200%;
    animation:pglow 2s linear infinite;
    width:100%;
    transform-origin:left center;
  }

  @keyframes pglow {
    0%  { background-position:0% }
    100%{ background-position:200% }
  }
</style>
</head>
<body>

  <!-- SLIDE 0: HOT FOOD MENU -->
  <div class="slide active" id="slide-0">
    <iframe src="hot.html" title="Hot Food Menu"></iframe>
  </div>

  <!-- SLIDE 1: SHAKES & DRINKS MENU -->
  <div class="slide" id="slide-1">
    <iframe src="shk.html" title="Shakes & Drinks Menu"></iframe>
  </div>

  <!-- SLIDE INDICATOR -->
  <div class="dots">
    <span class="dot-label">HOT FOOD</span>
    <div class="dot active" id="dot-0"></div>
    <div class="dot" id="dot-1"></div>
    <span class="dot-label">DRINKS</span>
  </div>

  <!-- COUNTDOWN PROGRESS BAR -->
  <div class="progress">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

<script>
  const DURATION   = 22000;  // 22 seconds per slide
  const FADE_TIME  = 1000;   // 1 second crossfade
  const TOTAL      = 2;

  let current = 0;
  let timer   = null;
  let progressAnim = null;

  const slides = Array.from({ length: TOTAL }, (_, i) => document.getElementById(`slide-${i}`));
  const dots   = Array.from({ length: TOTAL }, (_, i) => document.getElementById(`dot-${i}`));
  const bar    = document.getElementById('progress-bar');

  /* ── Animate the progress bar shrinking over DURATION ms ── */
  function startProgress() {
    bar.style.transition = 'none';
    bar.style.transform  = 'scaleX(1)';

    // Force reflow so the transition reset takes effect
    void bar.offsetWidth;

    bar.style.transition = `transform ${DURATION}ms linear`;
    bar.style.transform  = 'scaleX(0)';
  }

  /* ── Switch to the next slide ── */
  function nextSlide() {
    const prev = current;
    current = (current + 1) % TOTAL;

    // Swap active classes
    slides[prev].classList.remove('active');
    dots[prev].classList.remove('active');

    slides[current].classList.add('active');
    dots[current].classList.add('active');

    // Restart progress bar
    startProgress();
  }

  /* ── Kick off ── */
  startProgress();
  timer = setInterval(nextSlide, DURATION);
</script>

</body>
</html>
