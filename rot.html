<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:1920px; height:1080px;
    overflow:hidden;
    background:#0a0510;
    font-family:sans-serif;
  }

  /* ── SLIDES ── */
  .slide {
    position:absolute; top:0; left:0;
    width:1920px; height:1080px;
    opacity:0;
    transition:opacity 1.2s ease-in-out;
    pointer-events:none;
  }

  .slide.active {
    opacity:1;
    pointer-events:auto;
  }

  .slide iframe {
    width:1920px; height:1080px;
    border:none; display:block;
  }

  /* ── INDICATOR DOTS ── */
  .dots {
    position:fixed; bottom:22px; left:50%;
    transform:translateX(-50%);
    display:flex; align-items:center; gap:12px;
    z-index:9999;
  }

  .dot-label {
    font-size:11px; font-weight:700; letter-spacing:2px;
    color:rgba(255,255,255,.3); text-transform:uppercase;
    user-select:none;
  }

  .dot {
    width:12px; height:12px; border-radius:50%;
    background:rgba(255,255,255,.2);
    border:1.5px solid rgba(255,255,255,.3);
    transition:all 0.4s ease;
  }

  .dot.active {
    background:#ff2d78;
    border-color:#ff6fa8;
    box-shadow:0 0 14px rgba(255,45,120,.8);
    transform:scale(1.35);
  }

  /* ── PROGRESS BAR ── */
  .progress {
    position:fixed; bottom:0; left:0;
    width:100%; height:3px;
    background:rgba(255,255,255,.06);
    z-index:9998; overflow:hidden;
  }

  .progress-fill {
    height:100%; width:100%;
    background:linear-gradient(90deg,#ff2d78,#ffcc00,#00c6ff,#ff2d78);
    background-size:300%;
    transform-origin:left center;
    transform:scaleX(1);
    animation:pglow 3s linear infinite;
  }

  @keyframes pglow {
    0%   { background-position:0% }
    100% { background-position:300% }
  }
</style>
</head>

<html lang=&quot;en&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>

<link href=&quot;https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Nunito:wght@700;800;900&amp;display=swap&quot; rel=&quot;stylesheet&quot;>
<style>
  :root {
    /* White background palette */
    --bg:       #ffffff;
    --dark:     #1e0a30;   /* deep plum — primary text */
    --mid:      #5a3a78;   /* medium purple — descriptions */
    --pink:     #e8005a;   /* deepened pink for white bg */
    --pinksm:   #ff2d78;
    --sky:      #0077aa;   /* darkened sky blue */
    --gold:     #b07000;   /* darkened amber/gold */
    --gold2:    #d08800;
    --green:    #007a40;   /* darkened green */
    --card:     rgba(0,0,0,0.03);
    --bdr:      rgba(0,0,0,0.09);

    /* Vivid display colors (kept bright for accents) */
    --gold-v:   #ffcc00;
    --green-v:  #00e676;
    --sky-v:    #00c6ff;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:1920px; height:1080px;
    overflow:hidden;
    background:var(--bg);
    font-family:'Nunito', sans-serif;
    color:var(--dark);
  }

  .page {
    width:1920px; height:1080px;
    display:flex; flex-direction:column;
  }

  /* ── POWER BAR — slow-running ticker strip ── */
  .power-wrap { padding:12px 44px 0; flex-shrink:0; }

  .power-bar {
    height:90px; border-radius:14px;
    background:linear-gradient(100deg,#2a0a30 0%,#1c0828 40%,#0b1826 100%);
    border:2px solid var(--pinksm);
    box-shadow:0 4px 32px rgba(232,0,90,.25), 0 2px 0 rgba(255,255,255,.08) inset;
    overflow:hidden;
    display:flex; align-items:center;
    position:relative;
  }

  /* Animated gradient border glow */
  .power-bar::before {
    content:''; position:absolute; inset:-2px; border-radius:16px;
    background:linear-gradient(90deg,#e8005a,var(--sky-v),#ffcc00,#ff6fa8,#e8005a);
    background-size:400%; animation:bm 5s linear infinite; z-index:-1;
  }

  @keyframes bm { 0%{background-position:0% 50%} 100%{background-position:400% 50%} }

  /* Slow-running inner content */
  .pw-run {
    display:flex; width:max-content; align-items:center;
    animation:pw-scroll 55s linear infinite;
  }

  @keyframes pw-scroll {
    0%   { transform:translateX(0); }
    100% { transform:translateX(-50%); }
  }

  /* Each item block inside the scrolling bar */
  .pw-item {
    display:flex; align-items:center; gap:32px;
    padding:0 72px; white-space:nowrap; flex-shrink:0;
  }

  .p-badge {
    background:linear-gradient(90deg,#ffcc00,#ff9900); color:#000;
    font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:3px;
    padding:8px 26px; border-radius:50px;
    box-shadow:0 4px 16px rgba(255,204,0,.5);
    white-space:nowrap; flex-shrink:0;
  }

  .p-name {
    font-family:'Bebas Neue',sans-serif; font-size:60px; letter-spacing:3px;
    background:linear-gradient(90deg,#fff,#ffcc00);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    flex-shrink:0;
  }

  .p-desc { display:flex; align-items:center; gap:16px; font-size:20px; font-weight:800; color:#f0d0e0; }
  .p-dot  { width:5px; height:5px; background:#ff6fa8; border-radius:50%; flex-shrink:0; }

  .p-price {
    font-family:'Bebas Neue',sans-serif; font-size:72px; line-height:1;
    color:#ffcc00; text-shadow:0 0 30px rgba(255,204,0,.7); flex-shrink:0;
  }
  .p-price sup { font-size:32px; vertical-align:super; }

  .p-val { font-size:15px; color:#00e676; font-weight:900; letter-spacing:2px; text-transform:uppercase; flex-shrink:0; }

  /* Separator diamond between repeated blocks */
  .pw-sep {
    font-family:'Bebas Neue',sans-serif;
    font-size:28px; color:rgba(255,255,255,.25);
    flex-shrink:0;
  }

  /* ── 3-COLUMN GRID ── */
  .grid {
    flex:1; min-height:0;
    display:grid; grid-template-columns:1fr 1fr 1.08fr;
    padding:14px 44px 14px; gap:0;
  }
  .col {
    display:flex; flex-direction:column;
    padding:0 18px; overflow:hidden;
    border-right:2px solid rgba(0,0,0,0.07);
  }
  .col:first-child { padding-left:0; }
  .col:last-child  { padding-right:0; border-right:none; }

  /* Column header */
  .chdr {
    display:flex; align-items:center; gap:14px;
    padding-bottom:10px; margin-bottom:12px;
    border-bottom:3px solid; flex-shrink:0;
  }
  .cico { width:30px; height:30px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .cico-circle  { width:24px; height:24px; border-radius:50%; border:2.5px solid currentColor; }
  .cico-diamond { width:22px; height:22px; transform:rotate(45deg); border:2.5px solid currentColor; }
  .cttl { font-family:'Bebas Neue',sans-serif; font-size:46px; letter-spacing:5px; line-height:1; }
  .cln  { flex:1; height:2px; }

  /* BURGERS — blazing red/crimson (appetite-stimulating) */
  .col.burg .chdr { border-color:rgba(200,20,0,.55); }
  .col.burg .cttl { color:#cc1800; }
  .col.burg .cico { color:#cc1800; }
  .col.burg .cln  { background:linear-gradient(90deg,rgba(200,20,0,.5),transparent); }

  /* WEDGES — golden amber (sizzling fries, warm gravy) */
  .col.side .chdr { border-color:rgba(185,85,0,.55); }
  .col.side .cttl { color:#b85500; }
  .col.side .cico { color:#b85500; }
  .col.side .cln  { background:linear-gradient(90deg,rgba(185,85,0,.5),transparent); }

  /* COMBOS — deep pink */
  .col.comb .chdr { border-color:rgba(232,0,90,.45); }
  .col.comb .cttl { color:#cc0044; }
  .col.comb .cico { color:#cc0044; }
  .col.comb .cln  { background:linear-gradient(90deg,rgba(232,0,90,.4),transparent); }

  /* ── SUB-LABELS ── */
  .slbl {
    display:flex; align-items:center; gap:10px;
    border-radius:8px; padding:6px 16px;
    margin-bottom:8px; flex-shrink:0;
    font-family:'Nunito',sans-serif;
    font-size:18px; font-weight:900;
    letter-spacing:2px; text-transform:uppercase;
  }
  .slbl-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }

  /* CHICKEN — fiery red (hunger-inducing) */
  .slbl-chicken {
    background:rgba(200,20,0,.07);
    border:2px solid #cc1800; color:#aa1200;
  }
  .slbl-chicken .slbl-dot { background:#cc1800; }

  /* VEG — forest green */
  .slbl-veg {
    background:rgba(0,122,64,.08);
    border:2px solid #007a40; color:#005a2e;
  }
  .slbl-veg .slbl-dot { background:#007a40; }

  .gap8 { height:6px; flex-shrink:0; }

  /* ── ITEMS GROUP ── */
  .items-group { display:flex; flex-direction:column; gap:8px; overflow:hidden; }

  /* Item card */
  .ic {
    flex:1; min-height:0;

    background:var(--card); border:1px solid var(--bdr);

  .ic::before {

  .col.burg .ic::before           { background:linear-gradient(180deg,#e02000,#991000); }
  .col.side .ic.veg::before       { background:linear-gradient(180deg,#007a40,#004d28); }
  .col.side .ic:not(.veg)::before { background:linear-gradient(180deg,#c06000,#7a3800); }

  /* Burger cards — warm red tint, makes food look sizzling */
  .col.burg .ic {

    border-color:rgba(200,30,0,.16);

  .col.burg .ic-d { color:#7a3800; }
  .col.burg .ic-p { color:#cc2000; }

  /* VEG burgers — keep green for freshness */

  .col.burg .ic.veg .ic-d { color:#2d5a3a; }

  .col.side .ic:not(.veg) .ic-d { color:#8a5200; }

  /* WEDGES veg items — green */

  .col.side .ic.veg .ic-d { color:#2d5a3a; }
  .col.side .ic.veg .ic-p { color:#007a40; }

  .ic-l { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }

  /* Item name — base style, overridden per column below */
  .ic-n {

  .cc {

  /* Card backgrounds — light tints on white */
  .cc.c1 { background:rgba(0,119,170,.06); border:1.5px solid rgba(0,119,170,.22); }
  .cc.c2 { background:rgba(232,0,90,.06);  border:1.5px solid rgba(232,0,90,.22); }

  .cc.c4 {

    border:2px solid rgba(192,120,0,.35);
    box-shadow:0 4px 24px rgba(192,120,0,.12), 0 2px 12px rgba(232,0,90,.08);
  }

  /* CSS icon circle */
  .cc-ico {
    width:52px; height:52px; flex-shrink:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue',sans-serif; font-size:24px;
  }

  .cc.c2 .cc-ico { border:2.5px solid #e8005a; color:#e8005a; background:rgba(232,0,90,.08); }
  .cc.c3 .cc-ico { border:2.5px solid #c07800; color:#c07800; background:rgba(192,120,0,.08); }
  .cc.c4 .cc-ico { width:62px; height:62px; font-size:28px; border:2.5px solid #c07800; color:#c07800; background:rgba(192,120,0,.10); box-shadow:0 0 16px rgba(192,120,0,.25); }

  .cc-info { flex:1; min-width:0; }

  /* Combo name */
  .cc-name { font-family:'Bebas Neue',sans-serif; font-size:46px; letter-spacing:2px; line-height:1; }
  .cc.c1 .cc-name { color:#005f88; }
  .cc.c2 .cc-name { color:#cc0044; }
  .cc.c3 .cc-name { color:#8a5500; }
  .cc.c4 .cc-name {
    font-size:54px;
    background:linear-gradient(90deg,#c07800,#e8005a,#0077aa);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }

  /* Combo items */
  .cc-items { font-size:20px; color:var(--mid); font-weight:800; margin-top:7px; line-height:1.4; }
  .cc.c4 .cc-items { color:#3a2050; font-size:21px; }

  .cc-fam { font-size:14px; font-weight:900; letter-spacing:2px; color:#cc0044; margin-top:5px; text-transform:uppercase; }

  .cc-r { text-align:right; flex-shrink:0; }

  /* Combo price */
  .cc-price { font-family:'Bebas Neue',sans-serif; font-size:38px; line-height:1; }
  .cc.c1 .cc-price { color:#0077aa; }
  .cc.c2 .cc-price { color:#cc0044; }
  .cc.c3 .cc-price { color:#8a5500; }
  .cc.c4 .cc-price { font-size:46px; color:#8a5500; }

  /* Save label */
  .cc-save { font-size:12px; font-weight:900; letter-spacing:1.5px; color:#007a40; text-transform:uppercase; margin-top:3px; }
  .cc.c4 .cc-save { color:#8a5500; }
</style>
</head>

<script>
  const DURATION = 22000;   // 22 seconds per slide
  const TOTAL    = 2;

  let current = 0;

  const slides = [document.getElementById('slide-0'), document.getElementById('slide-1')];
  const dots   = [document.getElementById('dot-0'),   document.getElementById('dot-1')];
  const fill   = document.getElementById('progress-fill');

  function startProgress() {
    fill.style.transition = 'none';
    fill.style.transform  = 'scaleX(1)';
    void fill.offsetWidth;
    fill.style.transition = `transform ${DURATION}ms linear`;
    fill.style.transform  = 'scaleX(0)';
  }

  function nextSlide() {
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = (current + 1) % TOTAL;
    slides[current].classList.add('active');
    dots[current].classList.add('active');
    startProgress();
  }

  startProgress();
  setInterval(nextSlide, DURATION);
</script>
